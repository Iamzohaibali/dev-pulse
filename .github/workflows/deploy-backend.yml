name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ~/devpulse
            cat > ~/devpulse/.env << 'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
            FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }}
            PORT=5000
            EOF
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-backend:latest
            docker stop devpulse-backend || true
            docker rm devpulse-backend || true
            docker run -d \
              --name devpulse-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file ~/devpulse/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-backend:latest
            docker image prune -f
